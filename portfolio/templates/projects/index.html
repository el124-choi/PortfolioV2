<!doctype html>
<html>

{% extends 'base.html' %}

{% block header %}

    <h1>Projects</h1>

{% endblock %}

{% block content %}
    <p>Here are my completed projects:</p>
    <nav class="links">
        {% for c in c_projects %}
            <a href="{{ url_for('projects.project', index=c['id'])}}">{{c['title']}}</a>
        {% endfor %}
    </nav>
    <p>Here are the projects I am currently working on:</p>
    <nav class="links">
    {% for i in i_projects %}
        <a href="{{ url_for('projects.project', index=i['id'])}}">{{i['title']}}</a>
    {% endfor %}
    </nav>

{% endblock %}

</html>
