<!doctype html>
<html>

{% extends 'base.html' %}

{% block header %}

    <h1>Project page</h1>

{% endblock %}

{% block content %}
    <h2>{{entry['title']}}</h2>
    <p>Created: {{entry['created']}}</p>

    <img src="{{entry['img_path']}}">

    {% if entry['github'] != None %}
        <a href="{{entry['github']}}">Link</a>
    {% endif %}
    <p>{{entry['content']}}</p>
{% endblock %}


</html>
