{% extends 'base.html' %}

{% block header %}

    <h1>{% block title%}Blog{% endblock %}</h1>

{% endblock %}

{% block content %} 
    {% for entry in entries %}
        <article class="entry">
            <header>
                <div>
                    <div class="date">Posted: {{ entry['posted'] }}</div>
                </div>
            </header>
            <p class="body">{{ entry['content'] }}</p>
        </article>
        {% if not loop.last %}
            <hr>
        {% endif %}
    {% endfor %}
{% endblock %}
